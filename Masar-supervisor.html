<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مسار - تتبع الباص</title>
<link rel="manifest" href="manifest-supervisor.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<meta name="theme-color" content="#16233F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #FBF9F4; --card: #fff; --border: #ECE9DE; --header: #16233F; --gold: #C79A3E;
    --text: #2C2C2A; --muted: #8A8578; --muted2: #5B6472; --field-border: #E3E0D6;
  }
  body.dark {
    --bg: #12161F; --card: #1B2130; --border: #2A3142; --header: #0C1119; --gold: #D8B15C;
    --text: #EDEEF0; --muted: #9AA0AC; --muted2: #B4BAC6; --field-border: #2A3142;
  }
  html { overscroll-behavior-y: contain; }
  body { overscroll-behavior-y: contain; margin: 0; font-family: system-ui, Tahoma, Arial, sans-serif; background: var(--bg); }
  #app { max-width: 420px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }

  .login-header { background: var(--header); padding: 56px 24px 40px; text-align: center; border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; }
  .school-name { color: #fff; font-size: 20px; font-weight: 700; }
  .school-sub { color: #B9C2D4; font-size: 13px; margin-top: 6px; }
  form { padding: 32px 24px; flex: 1; }
  label { font-size: 13px; color: var(--muted2); display: block; margin-bottom: 6px; }
  .field { display: flex; align-items: center; background: var(--card); border: 1px solid var(--field-border); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .field input { border: none; outline: none; flex: 1; font-size: 15px; background: transparent; text-align: right; direction: rtl; color: var(--text); }
  .btn-main { width: 100%; background: var(--header); color: #fff; border: none; border-radius: 12px; padding: 14px 0; font-size: 15px; font-weight: 700; margin-top: 6px; cursor: pointer; }
  .btn-main:disabled { opacity: 0.6; }
  .error { color: #B4483A; font-size: 13px; margin-bottom: 10px; text-align: center; }
  .remember-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted2); margin: 4px 0 18px; }

  .header { background: var(--header); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; }
  .header-name { color: #fff; font-size: 16px; font-weight: 700; }
  .header-sub { color: #B9C2D4; font-size: 12px; margin-top: 2px; }
  .logout-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 10px; cursor: pointer; }

  .content { flex: 1; overflow-y: auto; padding: 18px 18px 90px; color: var(--text); }

  .trip-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; text-align: center; margin-bottom: 16px; }
  .trip-state { font-size: 14px; color: var(--muted2); margin-bottom: 4px; }
  .trip-timer { font-size: 30px; font-weight: 700; color: var(--header); margin-bottom: 18px; }
  body.dark .trip-timer { color: var(--gold); }
  .trip-btn { width: 100%; border: none; border-radius: 14px; padding: 18px 0; font-size: 17px; font-weight: 700; cursor: pointer; color: #fff; }
  .trip-btn.start { background: #2E7D32; }
  .trip-btn.end { background: #B4483A; }
  .trip-note { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
  .ping-status { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .ping-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2E7D32; margin-left: 6px; animation: pd 1.4s infinite; }
  @keyframes pd { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .wake-warning { background: #FBEFD9; border: 1px solid #E9CE96; color: #8A6512; font-size: 12.5px; padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; line-height: 1.6; }
  body.dark .wake-warning { background: #3A331C; border-color: #6B5A26; color: #E9CE96; }

  .search-field { display: flex; align-items: center; background: var(--card); border: 1px solid var(--field-border); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .search-field input { border: none; outline: none; flex: 1; font-size: 14px; background: transparent; text-align: right; direction: rtl; color: var(--text); }
  .class-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .class-chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 7px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--field-border); font-size: 12.5px; color: var(--muted2); cursor: pointer; white-space: nowrap; }
  .chip.active { background: var(--header); color: #fff; border-color: var(--header); }
  .student-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; }
  .student-name { font-size: 14.5px; font-weight: 600; color: var(--text); }
  .student-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .empty-note { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; }

  .stat-big { background: var(--header); border-radius: 16px; padding: 18px; color: #fff; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .stat-big .lbl { font-size: 13px; color: #B9C2D4; }
  .stat-big .num { font-size: 30px; font-weight: 700; }
  .stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat-box { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; }
  .stat-box .n { font-size: 20px; font-weight: 700; color: var(--header); }
  body.dark .stat-box .n { color: var(--gold); }
  .stat-box .l { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .class-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .class-bar-name { width: 90px; flex-shrink: 0; color: var(--muted2); }
  .class-bar-bg { flex: 1; height: 8px; background: var(--field-border); border-radius: 4px; overflow: hidden; }
  .class-bar-fill { height: 100%; background: var(--header); border-radius: 4px; }
  body.dark .class-bar-fill { background: var(--gold); }
  .class-bar-num { width: 22px; text-align: left; color: var(--muted2); }

  .tabbar { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
  .tab-btn { flex: 1; background: none; border: none; padding: 10px 4px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; font-family: inherit; font-size: 11.5px; }
  .tab-btn.active { color: #fff; font-weight: 700; background: var(--header); }
  body.dark .tab-btn.active { color: var(--header); background: var(--gold); }
  .tab-btn span.ic { font-size: 17px; }

  .fleet-wrap { position: relative; height: calc(100vh - 330px); min-height: 300px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
  #fleetMapEl { position: absolute; inset: 0; }
  .fleet-btn { position: absolute; bottom: 12px; z-index: 1100; background: var(--card); border: 1px solid var(--border); border-radius: 50%; width: 42px; height: 42px; font-size: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); cursor: pointer; }
  .fleet-btn.off { opacity: 0.45; }
  .fleet-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .fleet-legend-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; }
  .fleet-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .bus-name-tooltip { background: var(--header); color: #fff; border: none; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; box-shadow: none; }
  .bus-name-tooltip::before { display: none; }
  .leaflet-control-attribution { direction: ltr; font-size: 10px; }

  .native-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .native-card-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .native-card-sub { font-size: 12px; color: var(--muted); line-height: 1.8; margin-bottom: 10px; }
  .native-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; color: var(--text); }
  .native-btn { background: var(--header); color: #fff; border: none; border-radius: 9px; padding: 7px 12px; font-family: inherit; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .native-line { border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px; line-height: 1.8; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .native-line.ok { background: #E8F5E9; color: #2E7D32; }
  .native-line.late { background: #FBEFD9; color: #8A6512; }
  .native-line.warn { background: #FBE0DC; color: #8A2E1E; }
  body.dark .native-line.ok { background: #1F3A24; color: #8FD19A; }
  body.dark .native-line.late { background: #3A331C; color: #E9CE96; }
  body.dark .native-line.warn { background: #3F2220; color: #F0A99F; }
  .native-ready { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 12px; }
  .seen-line { font-size: 9.5px; font-weight: 500; }
  .seen-ok, .seen-wait { color: var(--muted); }
  .seen-late { color: #E67E22; font-weight: 700; }
  .seen-lost { color: #D32F2F; font-weight: 700; }
  .bus-name-tooltip .seen-ok, .bus-name-tooltip .seen-wait { color: #CFD6E4; }
  .bus-name-tooltip .seen-late { color: #FFB74D; }
  .bus-name-tooltip .seen-lost { color: #FF8A80; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ⚠️ نفس رابط Web App الموجود بأعلى index.html وMasar-staff.html — يُحدَّث بالثلاثة معاً دائماً
const API_URL = "https://script.google.com/macros/s/AKfycbzOiLsX7Gu5grOolZoMuQby_b505Hz1fKP7qaUvGTTpVhk1QwHaDMV2L68KxLTozOk7hw/exec";

const FIREBASE_DB_URL = "https://masar-tracking-21339-default-rtdb.europe-west1.firebasedatabase.app";
if (!firebase.apps.length) firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });

let session = null;       // { Supervisor_ID, Supervisor_Name, username, password, students, activeTrip }
let activeTab = "trip";
let loginError = "";
let busy = false;

let tripStartTs = null;
let tripTimerInterval = null;
let stats = null;
let studentFilter = "";
let classFilter = "الكل";

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

// ---------- تخزين الجلسة محلياً (تسجيل دخول تلقائي بالمرة القادمة) ----------
function saveCreds(u, p) { try { localStorage.setItem("masar_sup_u", u); localStorage.setItem("masar_sup_p", p); } catch (e) {} }
function loadCreds() { try { return { u: localStorage.getItem("masar_sup_u") || "", p: localStorage.getItem("masar_sup_p") || "" }; } catch (e) { return { u: "", p: "" }; } }
function clearCreds() { try { localStorage.removeItem("masar_sup_u"); localStorage.removeItem("masar_sup_p"); } catch (e) {} }

function haptic() { try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} }

// ---------- تطبيق أندرويد الأصلي (جسر AndroidTracker) ----------
// داخل تطبيق "مسار - المشرفة" توجد خدمة موقع أصلية ترسل الموقع بالخلفية بدون Traccar. الصفحة هي
// اللي تبدأ الإرسال وتوقفه (مرتبطاً بحالة الرحلة بالسيرفر). بالمتصفح العادي ما فيه جسر، فكل شي يشتغل كالسابق.
function hasNative() { return typeof window !== "undefined" && !!window.AndroidTracker; }
function nativeStatus() { try { return JSON.parse(window.AndroidTracker.status()); } catch (e) { return null; } }
function nativeStart() { try { return !!window.AndroidTracker.startTracking(API_URL, session.username, session.password); } catch (e) { return false; } }
function nativeStop() { try { if (hasNative()) window.AndroidTracker.stopTracking(); } catch (e) {} }
function nativeCall(name) { try { window.AndroidTracker[name](); } catch (e) {} }
// يضمن أن الإرسال الأصلي يتبع حالة الرحلة الفعلية بالسيرفر (استئناف بعد إغلاق التطبيق، أو إيقاف بعد إنهاء تلقائي)
function nativeSync(tripActive) {
  if (!hasNative() || !session) return;
  const st = nativeStatus();
  if (tripActive) { if (!st || !st.tracking) nativeStart(); }
  else if (st && st.tracking) nativeStop();
}
const NATIVE_STOP_REASONS = {
  NO_TRIP: "السيرفر يقول ما في رحلة نشطة", OUT_OF_HOURS: "خارج أوقات الرحلات", AUTH: "تعذر التحقق من الحساب",
  MAX_TIME: "انتهت المدة القصوى للإرسال", PERMISSION: "إذن الموقع غير مفعّل",
  START_FAILED: "تعذر تشغيل خدمة الموقع",
};
// يستدعيها التطبيق عند الرجوع من شاشة الإعدادات أو بعد نتيجة طلب إذن
if (typeof window !== "undefined") window.__nativeRefresh = () => { if (session && activeTab === "trip") render(); };

// ---------- تسجيل الدخول ----------
async function doLogin(username, password) {
  loginError = "";
  busy = true; render();
  try {
    const url = `${API_URL}?action=supervisorLogin&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) { loginError = data.error || "تعذر تسجيل الدخول"; busy = false; render(); return; }
    session = { Supervisor_ID: data.Supervisor_ID, Supervisor_Name: data.Supervisor_Name, username, password, students: data.students || [],
      hidden: new Set(String(data.hiddenTabs || "").split(",").map((x) => x.trim()).filter(Boolean)) };   // ⚙️ ما أخفاه المالك عن المشرفات
    saveCreds(username, password);
    haptic();
    if (data.activeTrip) {
      // كانت هناك رحلة نشطة أصلاً (مثلاً أُغلق التطبيق وسط الرحلة) — نكمل عرض المؤقّت فقط
      tripStartTs = new Date(String(data.activeTrip.Start_Time).replace(" ", "T")).getTime();
      if (tripTimerInterval) clearInterval(tripTimerInterval);
      tripTimerInterval = setInterval(() => { if (activeTab === "trip") render(); }, 1000);
    }
    nativeSync(!!data.activeTrip);
  } catch (err) {
    loginError = "تعذر الاتصال بالخادم";
  }
  busy = false; render();
}

function doLogout() {
  nativeStop();
  if (tripTimerInterval) { clearInterval(tripTimerInterval); tripTimerInterval = null; }
  clearCreds();
  session = null;
  render();
}

// ---------- الرحلة ----------
async function startTrip() {
  if (hasNative()) {
    // لازم إذن الموقع قبل ما نبدأ: وإلا الأهالي بيوصلهم "بدأت الرحلة" وما في موقع
    const st = nativeStatus();
    if (!st || !st.fine) {
      nativeCall("requestLocation");
      alert("لازم تسمحي بإذن الموقع أولاً، وبعدها اضغطي \"ابدأ الرحلة\" مرة ثانية.");
      return;
    }
  }
  busy = true; render();
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "startTrip", username: session.username, password: session.password }) });
    const data = await res.json();
    if (!data.ok) { alert(data.error || "تعذر بدء الرحلة"); busy = false; render(); return; }
    tripStartTs = Date.now();
    haptic();
    if (hasNative() && !nativeStart()) alert("بدأت الرحلة، لكن تعذر تشغيل إرسال الموقع. تأكدي من إذن الموقع، ثم اضغطي \"إعادة تشغيل الإرسال\".");
    if (tripTimerInterval) clearInterval(tripTimerInterval);
    tripTimerInterval = setInterval(() => { if (activeTab === "trip") render(); }, 1000);
  } catch (err) { alert("تعذر الاتصال بالخادم"); }
  busy = false; render();
}

async function endTrip() {
  busy = true; render();
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "endTrip", username: session.username, password: session.password }) });
    const data = await res.json();
    // لو الرحلة انتهت أصلاً (مثلاً تلقائياً) ما في داعي نعلّق الشاشة: نعتبرها منتهية
    const alreadyEnded = !data.ok && /لا توجد رحلة نشطة/.test(String(data.error || ""));
    if (!data.ok && !alreadyEnded) { alert(data.error || "تعذر إنهاء الرحلة"); busy = false; render(); return; }
    haptic();
  } catch (err) {
    // فشل الاتصال: الرحلة لسا نشطة بالسيرفر، فنبقي الشاشة والإرسال كما هم
    alert("تعذر الاتصال بالخادم. الرحلة لسا جارية — جرّبي مرة ثانية.");
    busy = false; render(); return;
  }
  nativeStop();
  if (tripTimerInterval) { clearInterval(tripTimerInterval); tripTimerInterval = null; }
  tripStartTs = null;
  busy = false; render();
}

function formatDuration(ms) {
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

// ---------- الإحصائيات ----------
async function loadStats() {
  stats = null; render();
  try {
    const url = `${API_URL}?action=getSupervisorStats&username=${encodeURIComponent(session.username)}&password=${encodeURIComponent(session.password)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.ok) stats = data;
  } catch (err) { /* تجاهل */ }
  render();
}

// ---------- العرض ----------
// تبويب أخفاه المالك من "ميزات الصفحة" (تجميلي بالواجهة). «الرحلة» ثابتة دوماً.
function supTabHidden(id) { return id !== "trip" && !!(session && session.hidden && session.hidden.has(id)); }

function render() {
  if (session && supTabHidden(activeTab)) activeTab = "trip";   // لو التبويب المفتوح انخفى: ارجع للرحلة
  teardownFleetMap();   // الخريطة مرتبطة بعنصر HTML بينمسح عند إعادة الرسم
  if (fleetOnline && (activeTab !== "fleet" || !session)) { try { firebase.database().goOffline(); } catch (e) { /* تجاهل */ } fleetOnline = false; }   // خرجنا من تبويب الخريطة: نقطع اتصال فايربيس
  const app = document.getElementById("app");
  if (!session) { app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  app.innerHTML = renderMain();
  attachMainEvents();
  if (activeTab === "fleet") initFleetMap();
}

function renderLogin() {
  const creds = loadCreds();
  return `
    <div class="login-header">
      <div class="school-name">مسار للتميز</div>
      <div class="school-sub">تطبيق مشرف/ة الباص</div>
    </div>
    <form id="loginForm">
      ${loginError ? `<div class="error">${esc(loginError)}</div>` : ""}
      <div class="field"><input id="loginUser" placeholder="اسم المستخدم" value="${esc(creds.u)}" autocomplete="username" /></div>
      <div class="field"><input id="loginPass" type="password" placeholder="كلمة السر" value="${esc(creds.p)}" autocomplete="current-password" /></div>
      <button type="submit" class="btn-main" ${busy ? "disabled" : ""}>${busy ? "جارِ الدخول..." : "دخول"}</button>
    </form>
  `;
}

function attachLoginEvents() {
  const form = document.getElementById("loginForm");
  if (!form) return;
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const u = document.getElementById("loginUser").value.trim();
    const p = document.getElementById("loginPass").value.trim();
    if (!u || !p) return;
    doLogin(u, p);
  });
}

function renderMain() {
  return `
    <div class="header">
      <div>
        <div class="header-name">👋 ${esc(session.Supervisor_Name)}</div>
        <div class="header-sub">${session.students.length} طالب مرتبط</div>
      </div>
      <button class="logout-btn" id="logoutBtn">خروج</button>
    </div>
    <div class="content">
      ${activeTab === "trip" ? renderTripTab() : ""}
      ${activeTab === "fleet" && !supTabHidden("fleet") ? renderFleetTab() : ""}
      ${activeTab === "students" && !supTabHidden("students") ? renderStudentsTab() : ""}
      ${activeTab === "stats" && !supTabHidden("stats") ? renderStatsTab() : ""}
    </div>
    <div class="tabbar">
      <button class="tab-btn ${activeTab === "trip" ? "active" : ""}" data-tab="trip"><span class="ic">🚌</span>الرحلة</button>
      ${supTabHidden("fleet") ? "" : `<button class="tab-btn ${activeTab === "fleet" ? "active" : ""}" data-tab="fleet"><span class="ic">🗺️</span>الباصات</button>`}
      ${supTabHidden("students") ? "" : `<button class="tab-btn ${activeTab === "students" ? "active" : ""}" data-tab="students"><span class="ic">👦</span>طلابي</button>`}
      ${supTabHidden("stats") ? "" : `<button class="tab-btn ${activeTab === "stats" ? "active" : ""}" data-tab="stats"><span class="ic">📊</span>إحصائياتي</button>`}
    </div>
  `;
}

function renderNativePanel(active) {
  const st = nativeStatus();
  if (!st) return "";
  let html = "";
  if (active) {
    if (st.tracking) {
      const ago = st.lastOk ? Math.max(0, Math.round((Date.now() - st.lastOk) / 1000)) : null;
      const late = ago !== null && ago > 90;
      html += `<div class="native-line ${late ? "late" : "ok"}"><span>📡 الموقع يُرسل تلقائياً ${ago === null ? "— بانتظار أول إشارة GPS..." : "— آخر إرسال قبل " + ago + " ث"}${late ? " (تأخير: تأكدي من الإنترنت والـGPS)" : ""}</span></div>`;
    } else {
      const why = NATIVE_STOP_REASONS[st.stopReason] || "";
      html += `<div class="native-line warn"><span>⚠️ إرسال الموقع متوقف${why ? " — " + why : ""}</span><button type="button" class="native-btn" data-native="__restart">إعادة تشغيل الإرسال</button></div>`;
    }
  }
  const rows = [
    { ok: st.fine, label: "إذن الموقع", action: "requestLocation", btn: "السماح" },
    { ok: st.bg, label: "الموقع \"طوال الوقت\" (ليشتغل والشاشة مقفلة)", action: "requestBackground", btn: "فتح الإعدادات" },
    { ok: st.notif, label: "الإشعارات", action: "requestNotifications", btn: "السماح" },
    { ok: st.battery, label: "البطارية: بدون قيود", action: "ignoreBattery", btn: "السماح" },
  ];
  if (rows.some((r) => !r.ok)) {
    html += `<div class="native-card">
      <div class="native-card-title">إعداد التطبيق (مرة وحدة)</div>
      <div class="native-card-sub">حتى يستمر إرسال الموقع والشاشة مقفلة أو وإنتِ فاتحة تطبيقات ثانية.
        ${st.brand === "samsung" ? "وبسامسونج: الإعدادات ← البطارية ← حدود الاستخدام بالخلفية، وتأكدي إن التطبيق مو بالتطبيقات النائمة." : ""}
        إذا Traccar مثبّت على نفس الجوال أوقفيه حتى ما تتكرر النقاط.</div>
      ${rows.map((r) => `<div class="native-row"><span>${r.ok ? "✅" : "⚠️"} ${r.label}</span>${r.ok ? "" : `<button type="button" class="native-btn" data-native="${r.action}">${r.btn}</button>`}</div>`).join("")}
    </div>`;
  } else if (!active) {
    html += `<div class="native-ready">✅ التطبيق جاهز لإرسال الموقع</div>`;
  }
  return html;
}

function renderTripTab() {
  const active = !!tripStartTs;
  const dur = active ? formatDuration(Date.now() - tripStartTs) : "00:00";
  const native = hasNative();
  const note = native
    ? (active
      ? `تم تفعيل الرحلة. تقدرين تقفلي الشاشة أو تفتحي تطبيقات ثانية، والإرسال مستمر. ارجعي لهالصفحة آخر الرحلة وضغطي "إنهاء الرحلة".`
      : `اضغطي "ابدأ الرحلة" عند انطلاق الباص — رح توصل رسالة تلقائية لأولياء الأمور، وتظهر خريطة حية بتطبيقهم.`)
    : (active
      ? `تم تفعيل الرحلة — الموقع يُرسل بالخلفية من تطبيق Traccar على جوالك. تقدرين تسكّري هالصفحة الآن، وترجعي تفتحيها بس وقت انتهاء الرحلة.`
      : `اضغطي "ابدأ الرحلة" عند انطلاق الباص (وتأكدي إن Traccar شغّال) — رح توصل رسالة تلقائية لأولياء الأمور، وتظهر خريطة حية بتطبيقهم.`);
  return `
    ${native ? renderNativePanel(active) : ""}
    <div class="trip-card">
      <div class="trip-state">${active ? "الرحلة جارية الآن" : "لا توجد رحلة حالياً"}</div>
      <div class="trip-timer">${dur}</div>
      <button class="trip-btn ${active ? "end" : "start"}" id="tripBtn" ${busy ? "disabled" : ""}>
        ${busy ? "..." : (active ? "إنهاء الرحلة" : "ابدأ الرحلة")}
      </button>
      <div class="trip-note">${note}</div>
    </div>
  `;
}

function renderStudentsTab() {
  const classes = ["الكل", ...Array.from(new Set(session.students.map(s => String(s.Class_Level || "").trim()).filter(Boolean)))];
  let list = session.students.filter(s => classFilter === "الكل" || String(s.Class_Level || "").trim() === classFilter);
  if (studentFilter.trim()) {
    const q = studentFilter.trim();
    list = list.filter(s => String(s.Student_Name || "").includes(q));
  }
  return `
    <div class="search-field"><input id="studentSearch" placeholder="بحث بالاسم..." value="${esc(studentFilter)}" /></div>
    <div class="class-chips">${classes.map(c => `<div class="chip ${c === classFilter ? "active" : ""}" data-class="${esc(c)}">${esc(c)}</div>`).join("")}</div>
    ${list.length === 0 ? `<div class="empty-note">لا يوجد طلاب مطابقين</div>` : list.map(s => `
      <div class="student-card">
        <div class="student-name">${esc(s.Student_Name)}</div>
        <div class="student-meta">${esc(s.Class_Level || "")}${s.Section ? " · شعبة " + esc(s.Section) : ""}${s.Parent_Name ? " · ولي الأمر: " + esc(s.Parent_Name) : ""}</div>
      </div>
    `).join("")}
  `;
}

function renderStatsTab() {
  if (!stats) return `<div class="empty-note">جارِ تحميل الإحصائيات...</div>`;
  const maxClass = Math.max(1, ...Object.values(stats.byClass || {}));
  const classRows = Object.entries(stats.byClass || {}).map(([cl, n]) => `
    <div class="class-bar-row">
      <div class="class-bar-name">${esc(cl)}</div>
      <div class="class-bar-bg"><div class="class-bar-fill" style="width:${Math.round((n / maxClass) * 100)}%"></div></div>
      <div class="class-bar-num">${n}</div>
    </div>
  `).join("");
  return `
    <div class="stat-big"><div class="lbl">إجمالي الطلاب المرتبطين</div><div class="num">${stats.totalStudents}</div></div>
    ${classRows}
    <div class="stat-row" style="margin-top:16px;">
      <div class="stat-box"><div class="n">${stats.tripsToday}</div><div class="l">رحلات اليوم</div></div>
      <div class="stat-box"><div class="n">${stats.tripsWeek}</div><div class="l">هالأسبوع</div></div>
      <div class="stat-box"><div class="n">${stats.tripsMonth}</div><div class="l">هالشهر</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-box" style="flex:1;"><div class="n">${stats.avgDurationMinutes} د</div><div class="l">متوسط مدة الرحلة</div></div>
    </div>
  `;
}

function attachMainEvents() {
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) logoutBtn.addEventListener("click", () => {
    const msg = (hasNative() && tripStartTs) ? "الرحلة جارية، والخروج بيوقف إرسال الموقع. متأكدة؟" : "تسجيل الخروج؟";
    if (confirm(msg)) doLogout();
  });

  document.querySelectorAll("[data-native]").forEach((b) => {
    b.addEventListener("click", () => {
      const a = b.dataset.native;
      if (a === "__restart") { if (!nativeStart()) alert("تعذر تشغيل الإرسال. تأكدي من إذن الموقع."); render(); }
      else nativeCall(a);
    });
  });

  const tripBtn = document.getElementById("tripBtn");
  if (tripBtn) tripBtn.addEventListener("click", () => { tripStartTs ? endTrip() : startTrip(); });

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTab = btn.dataset.tab;
      if (activeTab === "stats") loadStats(); else render();
    });
  });

  const search = document.getElementById("studentSearch");
  if (search) search.addEventListener("input", (e) => { studentFilter = e.target.value; render(); setTimeout(() => { const el = document.getElementById("studentSearch"); if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } }, 0); });

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => { classFilter = chip.dataset.class; render(); });
  });
}

// ---------- خريطة كل الباصات (المشرفة تشوف باقي الباصات + المسار) ----------
const FLEET_COLORS = ["#E74C3C", "#3498DB", "#2ECC71", "#F39C12", "#9B59B6", "#1ABC9C", "#E67E22", "#34495E", "#D35400", "#16A085"];
const TRAIL_MIN_DIST_M = 15;
function fleetColorFor(id) {
  let h = 0; const t = String(id || "");
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return FLEET_COLORS[h % FLEET_COLORS.length];
}
// نص "آخر ظهور" النسبي + مستوى اللون (ok / late / lost). offset = فرق ساعة Firebase عن ساعة الجهاز
function seenInfo(ts, offset) {
  if (!ts) return { text: "—", level: "ok" };
  const age = Math.max(0, Math.round((Date.now() + (offset || 0) - ts) / 1000));
  let text;
  if (age < 15) text = "الآن";
  else if (age < 60) text = `قبل ${age} ث`;
  else if (age < 3600) text = `قبل ${Math.floor(age / 60)} د`;
  else text = `قبل ${Math.floor(age / 3600)} ساعة`;
  let level = "ok";
  if (age > 300) { level = "lost"; text += " · منقطع"; }
  else if (age > 150) { level = "late"; text += " · متأخر"; }
  return { text, level };
}

let fleetOnline = false;
let fleetMap = null, fleetMarkers = {}, fleetTrips = {}, fleetDbRef = null, fleetOffsetRef = null;
let fleetTimeOffset = 0, fleetSeenTimer = null, fleetAutoFit = true;
let fleetTrailLayer = null, fleetTrailLines = {}, fleetTrailPts = {}, fleetTrailReady = false;

function trailVisiblePref() { try { return localStorage.getItem("masar_trail_visible") !== "0"; } catch (e) { return true; } }
function trailSavePref(v) { try { localStorage.setItem("masar_trail_visible", v ? "1" : "0"); } catch (e) {} }

function fleetIsMine(id) { return session && String(id).trim() === String(session.Supervisor_ID).trim(); }
function fleetName(id) { const t = fleetTrips[id]; return (t && t.name) ? t.name : String(id); }
function fleetBusIcon(color, mine) {
  const ring = mine ? "border:3px solid #fff;box-shadow:0 0 0 2px " + color + ",0 2px 6px rgba(0,0,0,0.5);" : "box-shadow:0 1px 4px rgba(0,0,0,0.4);";
  return L.divIcon({
    html: `<div style="width:30px;height:30px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:15px;${ring}">🚌</div>`,
    className: "", iconSize: [30, 30],
  });
}
function fleetTripSeen(id) {
  const t = fleetTrips[id];
  if (!t) return { text: "—", level: "ok" };
  if (t.lat === null || t.lat === undefined) return { text: "بانتظار أول إشارة", level: "wait" };
  return seenInfo(t.ts, fleetTimeOffset);
}
function fleetLabel(id) { return esc(fleetName(id)) + (fleetIsMine(id) ? " (أنتِ)" : ""); }
function fleetTipHtml(id) {
  const info = fleetTripSeen(id);
  return `<div style="text-align:center;line-height:1.3;"><div>${fleetLabel(id)}</div><div class="seen-line seen-${info.level}">${info.text}</div></div>`;
}
function fleetRefreshSeen() {
  if (!fleetMap) return;
  const legendEl = document.getElementById("fleetLegend");
  if (legendEl) {
    const ids = Object.keys(fleetTrips);
    legendEl.innerHTML = ids.length ? ids.map((id) => {
      const info = fleetTripSeen(id);
      return `<div class="fleet-legend-chip"><span class="fleet-legend-dot" style="background:${fleetColorFor(id)};"></span><div><div>${fleetLabel(id)}</div><div class="seen-line seen-${info.level}">${info.text}</div></div></div>`;
    }).join("") : `<div style="font-size:12.5px;color:var(--muted);">لا يوجد باصات بالطريق حالياً</div>`;
  }
  Object.keys(fleetMarkers).forEach((id) => fleetMarkers[id].setTooltipContent(fleetTipHtml(id)));
}
function fleetFitAll() {
  if (!fleetMap) return;
  const pts = Object.values(fleetMarkers).map((m) => m.getLatLng());
  if (pts.length) fleetAutoFit = false;
  if (pts.length === 1) fleetMap.setView(pts[0], 15);
  else if (pts.length > 1) fleetMap.fitBounds(L.latLngBounds(pts), { padding: [50, 50] });
}

function fleetApplyTrailVisibility() {
  if (!fleetMap || !fleetTrailLayer) return;
  const on = trailVisiblePref();
  if (on) { if (!fleetMap.hasLayer(fleetTrailLayer)) fleetTrailLayer.addTo(fleetMap); }
  else fleetMap.removeLayer(fleetTrailLayer);
  const btn = document.getElementById("fleetTrailBtn");
  if (btn) btn.classList.toggle("off", !on);
}
function fleetToggleTrails() { trailSavePref(!trailVisiblePref()); fleetApplyTrailVisibility(); }
function fleetDrawTrail(id) {
  if (!fleetTrailLayer) return;
  const pts = fleetTrailPts[id] || [];
  if (fleetTrailLines[id]) fleetTrailLines[id].setLatLngs(pts);
  else fleetTrailLines[id] = L.polyline(pts, { color: fleetColorFor(id), weight: 4, opacity: 0.75 }).addTo(fleetTrailLayer);
}
// المسار المخزّن بالسيرفر (من بداية الرحلة) — عبر Apps Script بعد التحقق من حساب المشرفة
async function fleetLoadTrails() {
  try {
    const url = `${API_URL}?action=getTrails&kind=supervisor&username=${encodeURIComponent(session.username)}&password=${encodeURIComponent(session.password)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!fleetMap) return;
    if (data.ok) Object.keys(data.trails || {}).forEach((id) => { fleetTrailPts[id] = data.trails[id]; fleetDrawTrail(id); });
  } catch (err) { /* بدون مسار — الخريطة تشتغل عادي */ }
  fleetTrailReady = true;
}
function fleetAppendTrailPoint(id, lat, lng) {
  if (!fleetTrailReady || !fleetMap) return;
  const pts = fleetTrailPts[id] || (fleetTrailPts[id] = []);
  const last = pts[pts.length - 1];
  if (last && fleetMap.distance(last, [lat, lng]) < TRAIL_MIN_DIST_M) return;
  pts.push([lat, lng]);
  fleetDrawTrail(id);
}

function renderFleetTab() {
  return `
    <div class="fleet-wrap">
      <div id="fleetMapEl"></div>
      <button type="button" class="fleet-btn" style="left:12px;" onclick="fleetFitAll()" title="عرض كل الباصات">🎯</button>
      <button type="button" class="fleet-btn" id="fleetTrailBtn" style="left:62px;" onclick="fleetToggleTrails()" title="إظهار / إخفاء المسار">〰️</button>
    </div>
    <div class="fleet-legend" id="fleetLegend"></div>`;
}

function initFleetMap() {
  if (!document.getElementById("fleetMapEl")) return;
  fleetMap = L.map("fleetMapEl", { zoomControl: true, attributionControl: true }).setView([35.95, 39.01], 12);
  fleetMap.attributionControl.setPrefix(false);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' }).addTo(fleetMap);
  fleetMarkers = {}; fleetTrips = {}; fleetAutoFit = true;
  fleetMap.on("dragstart", () => { fleetAutoFit = false; });
  fleetTrailLayer = L.layerGroup(); fleetTrailLines = {}; fleetTrailPts = {}; fleetTrailReady = false;
  fleetApplyTrailVisibility();
  fleetLoadTrails();

  try { firebase.database().goOnline(); } catch (e) { /* تجاهل */ }   // نفتح الاتصال فقط عند فتح تبويب الخريطة (خطة Spark المجانية: حد 100 اتصال متزامن)
  fleetOnline = true;
  fleetOffsetRef = firebase.database().ref(".info/serverTimeOffset");
  fleetOffsetRef.on("value", (snap) => { fleetTimeOffset = snap.val() || 0; });

  fleetDbRef = firebase.database().ref("live_trips");
  fleetDbRef.on("value", (snapshot) => {
    if (!fleetMap) return;
    const data = snapshot.val() || {};
    fleetTrips = {};
    let anyPoint = false;
    Object.keys(data).forEach((id) => {
      const trip = data[id];
      if (!trip || !trip.active) return;
      fleetTrips[id] = trip;
      if (trip.lat === null || trip.lat === undefined || trip.lng === null || trip.lng === undefined) return;
      anyPoint = true;
      fleetAppendTrailPoint(id, trip.lat, trip.lng);
      if (!fleetMarkers[id]) {
        fleetMarkers[id] = L.marker([trip.lat, trip.lng], { icon: fleetBusIcon(fleetColorFor(id), fleetIsMine(id)), zIndexOffset: fleetIsMine(id) ? 500 : 0 })
          .bindTooltip(fleetTipHtml(id), { permanent: true, direction: "top", className: "bus-name-tooltip", offset: [0, -14] })
          .addTo(fleetMap);
      } else {
        fleetMarkers[id].setLatLng([trip.lat, trip.lng]);
      }
    });
    Object.keys(fleetMarkers).forEach((id) => {
      if (!fleetTrips[id]) { fleetMap.removeLayer(fleetMarkers[id]); delete fleetMarkers[id]; }
    });
    Object.keys(fleetTrailLines).forEach((id) => {
      if (!fleetTrips[id]) { fleetTrailLayer.removeLayer(fleetTrailLines[id]); delete fleetTrailLines[id]; delete fleetTrailPts[id]; }
    });
    fleetRefreshSeen();
    if (anyPoint && fleetAutoFit) fleetFitAll();
  });
  fleetSeenTimer = setInterval(fleetRefreshSeen, 5000);
}

function teardownFleetMap() {
  if (fleetDbRef) { fleetDbRef.off(); fleetDbRef = null; }
  if (fleetOffsetRef) { fleetOffsetRef.off(); fleetOffsetRef = null; }
  if (fleetSeenTimer) { clearInterval(fleetSeenTimer); fleetSeenTimer = null; }
  if (fleetMap) { fleetMap.remove(); fleetMap = null; }
  fleetMarkers = {}; fleetTrips = {}; fleetTrailLayer = null; fleetTrailLines = {}; fleetTrailPts = {}; fleetTrailReady = false;
}

// ---------- الإقلاع ----------
(function boot() {
  const creds = loadCreds();
  if (creds.u && creds.p) doLogin(creds.u, creds.p); else render();
})();
</script>
